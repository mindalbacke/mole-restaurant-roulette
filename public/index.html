<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F2E7">
  <title>오늘 뭐 먹지? — 맛집 땅굴 룰렛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <header class="topbar">
      <a class="brand" href="#" aria-label="맛집 땅굴 룰렛 홈">
        <span class="brand-mark">M</span>
        <span>맛집 땅굴</span>
      </a>
      <button class="sound-button" id="soundButton" type="button" aria-label="효과음 켜기" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 4.5a4 4 0 0 1 0 5m2.5-8a8 8 0 0 1 0 11"/></svg>
      </button>
    </header>

    <section class="hero">
      <div class="eyebrow"><span></span> 오늘의 점심 구조대</div>
      <h1>고민은 그만,<br><em>두더지</em>에게 맡겨봐!</h1>
      <p>먹고 싶은 후보를 담고 룰렛을 돌려보세요.<br>오늘의 맛집을 두더지가 콕 골라드려요.</p>
    </section>

    <section class="game-layout">
      <div class="roulette-panel">
        <div class="mole-wrap" id="moleWrap" aria-hidden="true">
          <svg class="mole" viewBox="0 0 230 200">
            <ellipse class="mole-shadow" cx="115" cy="178" rx="104" ry="19"/>
            <path class="mole-body" d="M52 173c-3-52 10-102 63-102s67 50 63 102H52Z"/>
            <ellipse class="mole-ear" cx="57" cy="99" rx="24" ry="29"/>
            <ellipse class="mole-ear-inner" cx="58" cy="100" rx="12" ry="16"/>
            <ellipse class="mole-ear" cx="173" cy="99" rx="24" ry="29"/>
            <ellipse class="mole-ear-inner" cx="172" cy="100" rx="12" ry="16"/>
            <path class="mole-head" d="M42 116c0-58 29-96 73-96s73 38 73 96c0 43-32 66-73 66s-73-23-73-66Z"/>
            <ellipse class="mole-muzzle" cx="115" cy="128" rx="54" ry="39"/>
            <path class="mole-eye" d="M70 96c8-7 17-7 25 0"/>
            <path class="mole-eye" d="M135 96c8-7 17-7 25 0"/>
            <ellipse class="mole-nose" cx="115" cy="115" rx="18" ry="13"/>
            <path class="mole-mouth" d="M115 128c-1 13-10 19-21 18m21-18c1 13 10 19 21 18"/>
            <path class="mole-tooth" d="M105 146h20l-3 17h-14l-3-17Z"/>
            <path class="mole-hand" d="M49 151c-16 0-31-5-38-15 6-4 15-2 20 2-3-6-3-12 1-15 8 5 13 13 17 28Z"/>
            <path class="mole-hand" d="M181 151c16 0 31-5 38-15-6-4-15-2-20 2 3-6 3-12-1-15-8 5-13 13-17 28Z"/>
          </svg>
        </div>

        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true">
            <svg viewBox="0 0 50 66"><path d="M25 63 4 21C-4 4 15-3 25 8 35-3 54 4 46 21L25 63Z"/></svg>
          </div>
          <div class="wheel-shell">
            <canvas id="wheel" width="620" height="620" aria-label="맛집 후보 룰렛"></canvas>
            <button class="spin-center" id="spinButton" type="button"><span>돌리기!</span></button>
          </div>
        </div>

        <div class="result-box" id="resultBox" aria-live="polite">
          <span class="result-label">오늘은 여기 어때?</span>
          <strong id="resultName">룰렛을 돌려주세요!</strong>
          <span class="result-category" id="resultCategory">두더지가 기다리고 있어요</span>
        </div>
      </div>

      <aside class="choices-panel">
        <div class="choices-heading">
          <div>
            <span class="section-kicker">MY PICKS</span>
            <h2>맛집 후보</h2>
          </div>
          <span class="count-badge"><b id="activeCount">8</b>개 선택</span>
        </div>

        <div class="category-filters" id="categoryFilters" aria-label="카테고리 필터"></div>
        <div class="restaurant-list" id="restaurantList"></div>

        <form class="add-form" id="addForm">
          <label for="newRestaurant">맛집 직접 추가</label>
          <div class="add-row">
            <input id="newRestaurant" type="text" maxlength="16" placeholder="맛집 이름을 입력하세요" autocomplete="off">
            <select id="newCategory" aria-label="음식 카테고리">
              <option value="한식">한식</option>
              <option value="중식">중식</option>
              <option value="일식">일식</option>
              <option value="양식">양식</option>
              <option value="분식">분식</option>
              <option value="기타">기타</option>
            </select>
            <button type="submit" aria-label="맛집 추가">+</button>
          </div>
        </form>
        <p class="hint">최소 2개 이상의 맛집을 선택해 주세요.</p>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
