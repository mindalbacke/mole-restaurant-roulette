<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8A654A">
  <title>오늘 뭐 먹지? — 맛집 땅굴 룰렛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="earth-decor" aria-hidden="true">
    <span class="weed weed-one"><i></i><i></i><i></i></span>
    <span class="weed weed-two"><i></i><i></i><i></i></span>
    <span class="weed weed-three"><i></i><i></i><i></i></span>
    <span class="weed weed-four"><i></i><i></i><i></i></span>
    <span class="pebble pebble-one"></span>
    <span class="pebble pebble-two"></span>
    <span class="pebble pebble-three"></span>
  </div>
  <svg class="mole-symbols" aria-hidden="true">
    <symbol id="rain-mole-mascot" viewBox="0 0 100 100">
      <ellipse cx="50" cy="88" rx="34" ry="8" fill="#503b31" opacity=".18"/>
      <ellipse cx="50" cy="57" rx="34" ry="36" fill="#7d5947" stroke="#503b31" stroke-width="3"/>
      <ellipse cx="50" cy="66" rx="24" ry="19" fill="#e4bda8"/>
      <path d="M30 52q7-7 14 0m12 0q7-7 14 0" fill="none" stroke="#503b31" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="50" cy="61" rx="8" ry="6" fill="#e99c8c" stroke="#503b31" stroke-width="2"/>
      <path d="M44 72h12l-2 11h-8z" fill="#fffdf8" stroke="#503b31" stroke-width="2"/>
    </symbol>
    <symbol id="rain-mole-sketch" viewBox="0 0 100 100">
      <path d="M18 78C11 47 26 18 51 20c29 2 39 31 30 61-16 8-47 9-63-3Z" fill="#f8f2e7" stroke="#3d3732" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M31 52l11-3m17 1 11 3M41 66q9 8 18 0" fill="none" stroke="#3d3732" stroke-width="4" stroke-linecap="round"/>
      <path d="M43 58q7-7 14 0-6 10-14 0Z" fill="#9b6550" stroke="#3d3732" stroke-width="3"/>
      <path d="m36 27 5-10m14 9 8-9" fill="none" stroke="#3d3732" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="rain-mole-pixel" viewBox="0 0 100 100">
      <g shape-rendering="crispEdges">
        <path d="M20 30h10V20h40v10h10v10h10v40H80v10H20V80H10V40h10Z" fill="#6c5143"/>
        <path d="M30 40h10v10H30zm30 0h10v10H60Z" fill="#292522"/>
        <path d="M40 50h20v10H40z" fill="#ef9a8a"/>
        <path d="M30 60h40v20H30z" fill="#d7aa92"/>
        <path d="M40 70h20v20H40z" fill="#fff8e9"/>
      </g>
    </symbol>
    <symbol id="rain-mole-pop" viewBox="0 0 100 100">
      <path d="M17 78c0-32 11-59 34-59 26 0 35 27 32 61-17 12-49 11-66-2Z" fill="#b88b65" stroke="#2f2a26" stroke-width="4"/>
      <circle cx="37" cy="49" r="8" fill="#fff"/><circle cx="65" cy="49" r="8" fill="#fff"/>
      <circle cx="39" cy="50" r="4" fill="#2f2a26"/><circle cx="63" cy="50" r="4" fill="#2f2a26"/>
      <path d="M42 64q9-13 18 0-9 12-18 0Z" fill="#a86f5d" stroke="#2f2a26" stroke-width="3"/>
      <path d="M31 75q20 14 40 0" fill="none" stroke="#2f2a26" stroke-width="4" stroke-linecap="round"/>
    </symbol>
  </svg>
  <div class="mole-rain" id="moleRain" aria-hidden="true"></div>
  <main>
    <header class="topbar">
      <a class="brand" href="#" aria-label="맛집 땅굴 룰렛 홈">
        <span class="brand-mark">M</span>
        <span>맛집 땅굴</span>
      </a>
      <button class="sound-button" id="soundButton" type="button" aria-label="효과음 켜기" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 4.5a4 4 0 0 1 0 5m2.5-8a8 8 0 0 1 0 11"/></svg>
      </button>
    </header>

    <section class="hero">
      <div class="eyebrow"><span></span> 오늘의 밥 구조대</div>
      <h1>고민은 그만,<br><em>두더지</em>에게 맡겨봐!</h1>
      <p>먹고 싶은 후보를 담고 룰렛을 돌려보세요.<br>오늘의 맛집을 두더지가 콕 골라드려요.</p>
    </section>

    <section class="game-layout">
      <div class="roulette-panel">
        <div class="digger-scene" id="diggerScene" aria-hidden="true">
          <span class="dirt dirt-one"></span><span class="dirt dirt-two"></span><span class="dirt dirt-three"></span>
          <svg class="digger-mole" viewBox="0 0 220 170">
            <ellipse class="dig-hole" cx="110" cy="148" rx="105" ry="22"/>
            <g class="dig-head">
              <path class="dig-face" d="M45 111c0-59 26-91 65-91s65 32 65 91c0 32-28 48-65 48s-65-16-65-48Z"/>
              <ellipse class="dig-muzzle" cx="110" cy="112" rx="47" ry="32"/>
              <path class="dig-eye" d="M72 81q10-9 20 0m36 0q10-9 20 0"/>
              <ellipse class="dig-nose" cx="110" cy="101" rx="15" ry="11"/>
              <path class="dig-mouth" d="M110 112q-2 16-18 17m18-17q2 16 18 17"/>
            </g>
            <path class="dig-paw dig-paw-left" d="M58 119c-25-4-43-1-55 10 9 2 15 6 19 12-8-1-15 1-19 6 25 7 47-1 65-17Z"/>
            <path class="dig-paw dig-paw-right" d="M162 119c25-4 43-1 55 10-9 2-15 6-19 12 8-1 15 1 19 6-25 7-47-1-65-17Z"/>
            <path class="dig-mound" d="M0 150c26-25 53-18 72-8 24-20 53-16 75 0 23-11 51-13 73 8v20H0Z"/>
          </svg>
          <span class="dig-caption">영차영차! 땅굴 파는 중</span>
        </div>

        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true">
            <svg viewBox="0 0 50 66"><path d="M25 63 4 21C-4 4 15-3 25 8 35-3 54 4 46 21L25 63Z"/></svg>
          </div>
          <div class="wheel-shell">
            <canvas id="wheel" width="620" height="620" aria-label="맛집 후보 룰렛"></canvas>
            <button class="spin-center" id="spinButton" type="button"><span>돌리기!</span></button>
          </div>
        </div>

        <div class="result-box" id="resultBox" aria-live="polite">
          <div class="result-pending" id="resultPending">룰렛을 돌려주세요!<small>두더지가 기다리고 있어요</small></div>
          <div class="result-character">
            <svg class="result-mole-art" viewBox="0 0 260 160" aria-hidden="true">
              <ellipse cx="130" cy="145" rx="82" ry="13" fill="#503b31" opacity=".2"/>
              <ellipse cx="130" cy="86" rx="67" ry="68" fill="#7d5947" stroke="#503b31" stroke-width="4"/>
              <ellipse cx="130" cy="102" rx="46" ry="35" fill="#d9aa91"/>
              <path d="M91 79q10-9 21 0m36 0q10-9 21 0" fill="none" stroke="#503b31" stroke-width="5" stroke-linecap="round"/>
              <ellipse cx="130" cy="94" rx="16" ry="12" fill="#e99c8c" stroke="#503b31" stroke-width="3"/>
              <path d="M130 106q-2 13-17 16m17-16q2 13 17 16" fill="none" stroke="#503b31" stroke-width="4" stroke-linecap="round"/>
              <path d="M119 120h22l-3 19h-16Z" fill="#fffdf8" stroke="#503b31" stroke-width="2"/>
            </svg>
            <div class="result-sign">
              <span class="result-label">오늘의 밥 구조 완료!</span>
              <strong id="resultName">맛집 이름</strong>
              <span class="result-category" id="resultCategory">카테고리</span>
            </div>
            <span class="sign-paw sign-paw-left"></span>
            <span class="sign-paw sign-paw-right"></span>
          </div>
        </div>
      </div>

      <aside class="choices-panel">
        <div class="choices-heading">
          <div>
            <span class="section-kicker">MY PICKS</span>
            <h2>맛집 후보</h2>
          </div>
          <span class="count-badge"><b id="activeCount">8</b>개 선택</span>
        </div>

        <div class="category-filters" id="categoryFilters" aria-label="카테고리 필터"></div>
        <div class="restaurant-list" id="restaurantList"></div>

        <form class="add-form" id="addForm">
          <label for="newRestaurant">맛집 직접 추가</label>
          <div class="add-row">
            <input id="newRestaurant" type="text" maxlength="16" placeholder="맛집 이름을 입력하세요" autocomplete="off">
            <select id="newCategory" aria-label="음식 카테고리">
              <option value="한식">한식</option>
              <option value="중식">중식</option>
              <option value="일식">일식</option>
              <option value="양식">양식</option>
              <option value="분식">분식</option>
              <option value="기타">기타</option>
            </select>
            <button type="submit" aria-label="맛집 추가">+</button>
          </div>
        </form>
        <p class="hint">최소 2개 이상의 맛집을 선택해 주세요.</p>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
